# Linux distribution builds for Writer.
#
# Upstream (joelbqz/writer-computer) releases macOS-only from a maintainer
# laptop via scripts/distribute.sh — there is no CI there. This workflow
# lives on the `linux-upstream-builds` branch of the linux fork and builds
# the same upstream tag for Linux instead:
#
#   .deb      Debian / Ubuntu (x86_64, aarch64)
#   .rpm      Fedora / RHEL / openSUSE (x86_64, aarch64)
#   .AppImage portable single-file (x86_64, aarch64)
#   .tar.gz   generic tarball for Arch and other distros (x86_64, aarch64)
#
# How it triggers:
#   - workflow_dispatch  manual run, optionally pin `upstream_tag`
#                        (defaults to the newest upstream release)
#   - repository_dispatch  event type `upstream-release` with
#                        `client_payload.tag` — wire an upstream webhook or a
#                        small poller to POST here when upstream publishes
#   - schedule  daily poll of the upstream releases API; no-ops when the
#               fork already ships that tag
#
# How it builds:
#   1. resolve job picks the upstream tag (input > payload > latest API)
#   2. build matrix checks out PRISTINE upstream at that tag into src/ and
#      applies scripts/patch-tauri-linux.py (canonical) with
#      patches/tauri-linux-bundle.patch as fallback — so Linux packaging
#      never depends on fork drift
#   3. release job publishes everything under `<upstream-tag>-linux`
#      (e.g. v0.6.0-linux) so fork tags never collide with upstream tags.
#
# Fork releases do not affect the in-app updater: tauri.conf.json points the
# updater at upstream's latest.json, which only upstream can change.

name: linux-release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream tag to build (empty = latest release)"
        required: false
        default: ""
      upstream_repo:
        description: "Upstream repository"
        required: false
        default: "joelbqz/writer-computer"
  repository_dispatch:
    types: [upstream-release]
  schedule:
    - cron: "17 6 * * *"

env:
  UPSTREAM_REPO: ${{ inputs.upstream_repo || 'joelbqz/writer-computer' }}
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: resolve upstream tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      fork_tag: ${{ steps.pick.outputs.fork_tag }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - name: Pick tag and check fork releases
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          TAG="${INPUT_TAG:-$PAYLOAD_TAG}"
          if [ -z "$TAG" ]; then
            TAG="$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)"
          fi
          echo "Upstream tag: $TAG"
          FORK_TAG="$TAG-linux"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "fork_tag=$FORK_TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$FORK_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$EVENT" = "schedule" ]; then
              echo "Fork already ships $FORK_TAG — nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.gunarch }})
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - gunarch: x86_64
            runs_on: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            rust_host: ""
          - gunarch: aarch64
            runs_on: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            rust_host: --target aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Check out fork (patches + script)
        uses: actions/checkout@v4
        with:
          path: fork
          ref: linux-upstream-builds

      - name: Check out pristine upstream at tag
        uses: actions/checkout@v4
        with:
          repository: joelbqz/writer-computer
          ref: ${{ needs.resolve.outputs.tag }}
          path: src

      - name: Apply Linux packaging patches
        working-directory: ${{ github.workspace }}/src
        run: |
          cp "${{ github.workspace }}/fork/scripts/patch-tauri-linux.py" scripts/patch-tauri-linux.py
          cp -r "${{ github.workspace }}/fork/patches" patches
          python3 scripts/patch-tauri-linux.py \
            || git apply patches/tauri-linux-bundle.patch

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            rpm libfuse2 patchelf xdg-utils

      - name: Set up vp toolchain
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          working-directory: src
          cache: true

      - name: Build bundles (deb, rpm, appimage)
        working-directory: ${{ github.workspace }}/src/apps/desktop
        run: |
          # Linux fork builds are always unsigned: the in-app updater points
          # at upstream's latest.json, so signed artifacts would be dead
          # weight. createUpdaterArtifacts=false skips the signing flow
          # entirely — tauri fails on even an empty TAURI_SIGNING_PRIVATE_KEY
          # when updater artifacts are enabled, so ensure unset (not empty).
          unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          vp exec tauri build --bundles deb,rpm,appimage ${{ matrix.rust_host }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Pack generic tarball for Arch and other distros
        working-directory: ${{ github.workspace }}/src
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")"
          RELEASE_DIR="apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release"
          [ -d "$RELEASE_DIR" ] || RELEASE_DIR="apps/desktop/src-tauri/target/release"
          BIN=""
          for name in desktop writer Writer; do
            if [ -x "$RELEASE_DIR/$name" ]; then BIN="$RELEASE_DIR/$name"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "Error: release binary not found in $RELEASE_DIR"
            ls -la "$RELEASE_DIR"
            exit 1
          fi
          STAGE="$(mktemp -d)"
          cp "$BIN" "$STAGE/writer"
          cp apps/desktop/src-tauri/icons/128x128.png "$STAGE/writer.png" 2>/dev/null || true
          printf '[Desktop Entry]\nType=Application\nName=Writer\nExec=writer\nIcon=writer\nCategories=Utility;\nMimeType=text/markdown;\n' > "$STAGE/writer.desktop"
          tar -czf "$RELEASE_DIR/Writer_${VERSION}_linux_${{ matrix.gunarch }}.tar.gz" -C "$STAGE" writer writer.desktop writer.png
          rm -rf "$STAGE"
          ls -la "$RELEASE_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.gunarch }}
          if-no-files-found: error
          path: |
            src/apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            src/apps/desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            src/apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            src/apps/desktop/src-tauri/target/**/release/Writer_*_linux_*.tar.gz

  release:
    name: publish fork release
    needs: [resolve, build]
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create fork release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          NOTES="$(mktemp)"
          {
            echo "Linux builds of upstream ${{ needs.resolve.outputs.tag }}."
            echo ""
            echo "Install with your distro's package (.deb / .rpm), run the .AppImage anywhere, or unpack the .tar.gz (Arch and others)."
            echo ""
            echo "Upstream release notes: https://github.com/$UPSTREAM_REPO/releases/tag/${{ needs.resolve.outputs.tag }}"
          } > "$NOTES"
          gh release create "${{ needs.resolve.outputs.fork_tag }}" dist/* \
            --title "Writer ${{ needs.resolve.outputs.fork_tag }}" \
            --notes-file "$NOTES"
